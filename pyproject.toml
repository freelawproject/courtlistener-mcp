[build-system]
build-backend = "setuptools.build_meta"
requires = [
  "setuptools",
]

[project]
name = "courtlistener-mcp"
version = "1.3.1"
description = "Official MCP server for CourtListener"
authors = [{ name = "Free Law Project", email = "info@free.law" }]
requires-python = ">=3.10"
readme = "README.md"
license = "BSD-2-Clause"
keywords = [
    "legal",
    "courts",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

urls.Repository = "https://github.com/freelawproject/courtlistener-mcp"
urls."Organisation Homepage" = "https://free.law/"

dependencies = [
    "asyncpg>=0.32.0",
    "courtlistener-api-client==2.0.1",
    "eyecite>=2.6.0",
    "fastmcp==4.1.3",
    "gunicorn>=25.3.0",
    "jsonschema>=4.0.0",
    "prometheus-client>=0.20.0",
    "py-key-value-aio[postgresql,redis,wrappers-encryption]>=0.4.4,<0.6.0",
    "redis>=5.0.0",
    "sentry-sdk>=2.64.0",
    "tiktoken>=0.12.0",
]

[project.optional-dependencies]
dev = [
    "pyrefly>=1.4.0",
    "types-jsonschema>=4.0.0",
    "pre-commit>=4.5.1",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "python-dotenv>=1.0.0",
    "ruff>=0.4.0",
    "tox-uv>=1.29.0",
    "py-key-value-aio[disk]",
    "asyncpg-stubs>=0.32.0",
]

[project.scripts]
courtlistener-mcp = "courtlistener_mcp.server.main:main"

[tool.setuptools.packages.find]
include = ["courtlistener_mcp*"]

[tool.setuptools.package-data]
"courtlistener_mcp" = ["assets/**"]

[tool.pytest.ini_options]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"

[tool.pyrefly]
project-includes = ["courtlistener_mcp"]
python-version = "3.10"
check-unannotated-defs = true

# Flag ignore comments that no longer suppress anything.
[tool.pyrefly.errors]
unused-ignore = true
unused-type-ignore = true

[tool.ruff]
line-length = 79
lint.extend-safe-fixes = [
  # non-pep585-annotation
  "UP006",
]
lint.select = [
  # flake8-bugbear
  "B",
  # flake8-comprehensions
  "C4",
  # pycodestyle
  "E",
  # Pyflakes errors
  "F",
  # isort
  "I",
  # flake8-simplify
  "SIM",
  # flake8-tidy-imports
  "TID",
  # pyupgrade
  "UP",
  # Pyflakes warnings
  "W",
]
lint.ignore = [
  # flake8-bugbear opinionated rules
  "B9",
  # line-too-long
  "E501",
  # suppressible-exception
  "SIM105",
  # if-else-block-instead-of-if-exp
  "SIM108",
  # printf-string-formatting
  "UP031",
]
lint.flake8-tidy-imports.ban-relative-imports = "all"
